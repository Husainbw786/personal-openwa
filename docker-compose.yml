# Everything runs with:  docker compose up -d --build
# Then open http://localhost:3000 (or http://<this-computer>:3000 from your phone on the same Wi-Fi / Tailscale).

services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:${OPENWA_VERSION:-0.24.0}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ_APP:-Asia/Kolkata}
      ENGINE_TYPE: baileys                  # lightweight engine, no Chrome needed
      API_MASTER_KEY: ${OPENWA_API_KEY}     # our app uses this key to talk to OpenWA
      AUTO_START_SESSIONS: "true"           # reconnect WhatsApp automatically after a restart
      BAILEYS_MARK_ONLINE_ON_CONNECT: "false" # keep notifications working on your phone
      SEND_PACING_ENABLED: "true"           # OpenWA's own safety limits for new numbers / cold messages
      # OpenWA ramps a number up from 20 sends/day starting the day it was linked, even when the WhatsApp
      # account is years old. Our numbers are old, and the app's DAILY_CAP and gaps set the real pace.
      SEND_PACING_WARMUP_SCHEDULE: "1000"
      SEND_PACING_COLD_DAILY_CAP: "100"
      SSRF_ALLOWED_HOSTS: wa-app            # allow delivery updates to our app on the internal network
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
      # OpenWA's API throttle defaults (10/s, 100/min, 1000/h) starve our background cache and
      # hidden-number lookups. Only our app can reach OpenWA (internal network + 127.0.0.1), so lift them.
      RATE_LIMIT_SHORT_LIMIT: "5000"
      RATE_LIMIT_MEDIUM_LIMIT: "200000"
      RATE_LIMIT_LONG_LIMIT: "10000000"
    volumes:
      - openwa-data:/app/data               # WhatsApp login lives here: back this up
    ports:
      - "127.0.0.1:2785:2785"               # OpenWA's own dashboard, only reachable from this computer

  # Same gateway, Chromium engine (whatsapp-web.js): a real WhatsApp Web page per number. Heavier than
  # Baileys but behaves exactly like WhatsApp Web, incl. "Link with phone number". All numbers are
  # linked here now; switching engines means re-linking.
  openwa-web:
    image: ghcr.io/rmyndharis/openwa:${OPENWA_VERSION:-0.24.0}
    restart: unless-stopped
    shm_size: 1gb                           # Chromium crashes with Docker's 64 MB default
    environment:
      NODE_ENV: production
      TZ: ${TZ_APP:-Asia/Kolkata}
      ENGINE_TYPE: whatsapp-web.js
      API_MASTER_KEY: ${OPENWA_API_KEY}
      AUTO_START_SESSIONS: "true"
      # OpenWA's built-in MCP server at /mcp, so AI agents can use WhatsApp. Agents get their own
      # revocable API key; write tools (send, etc.) are on.
      MCP_ENABLED: "true"
      MCP_READONLY: "false"
      SEND_PACING_ENABLED: "true"
      SEND_PACING_WARMUP_SCHEDULE: "1000"   # see the openwa service above
      SEND_PACING_COLD_DAILY_CAP: "100"
      SSRF_ALLOWED_HOSTS: wa-app
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
      RATE_LIMIT_SHORT_LIMIT: "5000"
      RATE_LIMIT_MEDIUM_LIMIT: "200000"
      RATE_LIMIT_LONG_LIMIT: "10000000"
    volumes:
      - openwa-web-data:/app/data

  wa-app:
    build: .
    restart: unless-stopped
    depends_on:
      - openwa
      - openwa-web
    env_file: .env
    environment:
      OPENWA_URL: http://openwa:2785
      OPENWA_WEB_URL: http://openwa-web:2785
      WEBHOOK_URL: http://wa-app:3000/hooks/openwa
    volumes:
      - app-data:/app/data                  # templates, send history, hidden numbers
    ports:
      - "3000:3000"

volumes:
  openwa-data:
  openwa-web-data:
  app-data:
