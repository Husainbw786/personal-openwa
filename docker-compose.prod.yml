# Server overlay: adds HTTPS in front of the app and stops exposing port 3000 directly.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
# The app image is built by GitHub Actions and pulled from GHCR; APP_TAG picks the commit (default latest).
# Needs DOMAIN in .env (e.g. 130-210-23-220.sslip.io, or your own domain pointing at the server).

services:
  wa-app:
    image: ghcr.io/husainbw786/personal-openwa:${APP_TAG:-latest}
    ports: !reset []
    mem_limit: 1g
    volumes:
      - ./backups:/app/backups   # hourly backup files; pushed to a private GitHub repo by the server's cron

  # Sized for the 24 GB Oracle server running several numbers. On a 1 GB server use 700m and
  # drop NODE_OPTIONS, or OpenWA runs out of memory.
  openwa:
    mem_limit: 8g
    environment:
      NODE_OPTIONS: --max-old-space-size=6144

  # Chromium: roughly 300-500 MB per linked number.
  openwa-web:
    mem_limit: 4g
    environment:
      TRUSTED_PROXIES: 172.16.0.0/12   # Caddy, so MCP rate limits see the agent's real IP

  # HTTPS for the app, plus /mcp for AI agents (OpenWA's MCP server on the Chromium gateway).
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - wa-app
      - openwa-web
    environment:
      DOMAIN: ${DOMAIN}
      # Private link for MCP clients that can't send a key header (e.g. ChatGPT connectors): /mcp/<secret>
      MCP_LINK_SECRET: ${MCP_LINK_SECRET:-}
      MCP_AGENT_KEY: ${MCP_AGENT_KEY:-}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data

configs:
  caddyfile:
    content: |
      {$$DOMAIN} {
        # Private no-login link for clients without OAuth or key headers (ChatGPT): adds the agent key.
        # Some URL checks only send GET/HEAD, which OpenWA answers 405; reply with an empty event stream.
        @mcplink path /mcp/{$$MCP_LINK_SECRET}
        handle @mcplink {
          @probe method GET HEAD
          handle @probe {
            header Content-Type text/event-stream
            header Cache-Control no-cache
            respond ": ok" 200
          }
          handle {
            rewrite * /mcp
            reverse_proxy openwa-web:2785 {
              header_up Authorization "Bearer {$$MCP_AGENT_KEY}"
              header_up Accept "application/json, text/event-stream"
            }
          }
        }
        # Everything else goes to the app, incl. /mcp (OAuth sign-in or API key, then on to OpenWA),
        # /oauth/* and /.well-known/*. flush_interval -1 streams MCP replies as they come.
        handle {
          reverse_proxy wa-app:3000 {
            flush_interval -1
          }
        }
      }

volumes:
  caddy-data:
