# Every push to main: type-check + build, build the Docker image here and push it to GHCR,
# then have the Google Cloud server pull it and restart (the tiny VM never builds anything).
# Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         server IP
#   DEPLOY_SSH_KEY      private key of the `deploy` user on the server
#   DEPLOY_KNOWN_HOSTS  the server's SSH host key line (pins the server, prevents MITM)
# Variable:
#   APP_URL             e.g. https://34-56-155-51.sslip.io (used for the health check)
# The server keeps its own .env (passwords, keys); it is never uploaded from here.
# The server pulls the image with this run's short-lived GITHUB_TOKEN and logs out right after,
# so no registry credentials are stored anywhere.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/husainbw786/personal-openwa

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Server type-check
        working-directory: server
        run: npm ci --no-fund --no-audit && npm run typecheck
      - name: Web build
        working-directory: web
        run: npm ci --no-fund --no-audit && npm run build

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload compose files
        run: |
          rsync -az docker-compose.yml docker-compose.prod.yml deploy@${{ secrets.DEPLOY_HOST }}:/opt/wa-sender/

      - name: Pull and restart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh deploy@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/wa-sender
            export APP_TAG=${{ github.sha }}
            docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null
            trap "docker logout ghcr.io >/dev/null" EXIT
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull wa-app
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --remove-orphans
            docker image prune -f >/dev/null
          '

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.APP_URL }}/healthz"; then
              echo; echo "Deployed ✅"
              ssh deploy@${{ secrets.DEPLOY_HOST }} 'cd /opt/wa-sender && docker compose -f docker-compose.yml -f docker-compose.prod.yml ps --format "table {{.Service}}\t{{.Image}}\t{{.Status}}"'
              exit 0
            fi
            sleep 5
          done
          echo "App did not become healthy" >&2
          ssh deploy@${{ secrets.DEPLOY_HOST }} 'cd /opt/wa-sender && docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50 wa-app'
          exit 1
